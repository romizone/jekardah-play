<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nasi Goreng Chef — Jekardah Play</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#241a10;overscroll-behavior:none;touch-action:manipulation}
#stage{position:relative;max-width:480px;margin:0 auto;height:100dvh;max-height:100dvh;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:auto;image-rendering:pixelated;border:2px solid #7a5a1e;box-shadow:0 0 40px rgba(255,180,60,.12)}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#efe9dc;font-family:system-ui,sans-serif;pointer-events:none}
#ui.hidden{display:none}
#ui h1{font-size:26px;color:#ffd429;margin:0 0 8px;letter-spacing:2px}
#ui p{font-size:13px;color:#d0b890;max-width:300px;margin:0 0 16px;line-height:1.6}
#ui .hint{font-size:11px;color:#8a7a5a}
#btnStart{pointer-events:auto;font:800 15px system-ui;letter-spacing:1px;background:#ffd429;color:#1a1408;border:3px solid #1a1408;box-shadow:3px 3px 0 #e5383b;padding:10px 26px;cursor:pointer}
#hud{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;color:#ffd429;font:700 12px system-ui;text-shadow:1px 1px 0 #000;pointer-events:none}
#pads{position:absolute;bottom:0;left:0;right:0;display:flex;pointer-events:auto}
#pads button{flex:1;padding:22px 0;border:0;background:rgba(255,212,41,.10);color:#ffd429;font:800 11px system-ui;letter-spacing:1px;border-top:2px solid rgba(255,212,41,.25);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#pads button:active{background:rgba(255,212,41,.28)}
@media(min-height:640px){#pads button{padding:28px 0}}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv" width="320" height="480"></canvas>
<div id="hud"><span id="sc">Rp 0</span><span id="tm">⏱ 0</span></div>
<div id="ui">
  <h1>NASI GORENG CHEF</h1>
  <p id="msg">Dapur ramai malam ini!<br>Klik pesanan → ambil bahan → masak wok → saji.<br>Jangan sampai nasi gosong!</p>
  <button id="btnStart">▶ MULAI</button>
  <p class="hint">Sentuh/klik area di layar &nbsp;·&nbsp; Keyboard: 1-5 pilih aksi</p>
</div>
<div id="pads">
  <button id="b1">1 PESANAN</button>
  <button id="b2">2 NASI</button>
  <button id="b3">3 WOK</button>
  <button id="b4">4 SAJI</button>
  <button id="b5">5 BUANG</button>
</div>
</div>
<script>
/* JEK — kerangka game mini Jekardah Play (murni, tanpa dependency)
   Kontrak:
     JEK.boot(slug, function(g){ g.run(Game); })
     function Game(ctx, S){ return { update(dt), draw(ctx) } }
     S: beep(f,dur,type), onKey(k,fn), hi(), saveHi(v), over(title,sub,extra)
*/
window.JEK = (function(){
  function hiKey(slug){ return "jek_hi_" + slug; }

  function loop(update, draw){
    let last = 0;
    function frame(now){
      const dtms = Math.min(50, now - last); last = now;
      const dt = Math.max(1, Math.round(dtms / (1000/60))); // tick @60fps
      try{ update(dt); draw(); }catch(e){}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function beep(freq, dur, type, vol){
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      if(!beep.ctx) beep.ctx = new AC();
      if(beep.ctx.state === "suspended") beep.ctx.resume();
      const o = beep.ctx.createOscillator(), gn = beep.ctx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      gn.gain.value = (vol == null ? 0.06 : vol);
      gn.gain.exponentialRampToValueAtTime(0.0001, beep.ctx.currentTime + dur);
      o.connect(gn); gn.connect(beep.ctx.destination);
      o.start(); o.stop(beep.ctx.currentTime + dur + 0.02);
    }catch(e){}
  }

  function boot(slug, cb){
    document.addEventListener("DOMContentLoaded", function(){
      const cv  = document.getElementById("cv");
      const ui  = document.getElementById("ui");
      const btn = document.getElementById("btnStart");
      const h1  = ui ? ui.querySelector("h1") : null;
      const msg = document.getElementById("msg");

      btn.addEventListener("click", function(){
        if(ui) ui.classList.add("hidden");
        const ctx = cv.getContext("2d");
        const keys = {};
        const S = {
          cv, W: cv.width, H: cv.height, beep: beep,
          count: function(k){ (this._c = this._c || {}); this._c[k] = (this._c[k]||0)+1; return this._c[k]; },
          onKey: function(key, fn){ keys[String(key).toLowerCase()] = fn; },
          hi: function(){ return +(localStorage.getItem(hiKey(slug)) || 0); },
          saveHi: function(v){ if(v > this.hi()) localStorage.setItem(hiKey(slug), v); },
          over: function(title, sub, extra){
            if(!ui) return;
            ui.classList.remove("hidden");
            if(h1) h1.textContent = (title && !/^Skor|^Rp/.test(title)) ? title : "GAME OVER";
            const scoreLine = (title && /^Skor|^Rp/.test(title)) ? title + "<br>" : "";
            if(msg) msg.innerHTML = scoreLine + (sub || "") + (extra ? "<br>" + extra : "") +
              "<br><br>Rekor: " + ( +(localStorage.getItem(hiKey(slug)) || 0) );
            btn.textContent = "↻ MAIN LAGI";
          }
        };
        window.addEventListener("keydown", function(e){
          const k = e.key.toLowerCase();
          if(keys[k]){ e.preventDefault(); keys[k](); }
        });
        cb({ run: function(G){
          const inst = G(ctx, S);
          if(inst && inst.update && inst.draw) loop(inst.update, function(){ inst.draw(ctx); });
        }});
      });
    });
  }

  return { boot, beep };
})();

</script>
<script>
let g;
JEK.boot("nasi-goreng-chef",(h)=>{g=h;g.run(Game)});
function Game(ctx,S){
 const W=320,H=480;
 let t=0,state="play",money=0,time=0,lives=3,flash=0;
 // alur: order(bahan) → grab nasi → wok masak (progress) → saji sebelum gosong
 const BAHAN=["ayam","udang","sayur","telur"];
 let orders=[];   // {bahan, patience}
 let wok=null;    // {bahan, cook, burnt, ready}
 let holding=null;// "nasi" or bahan
 let spawnT=120;

 function newOrder(){
   const b=BAHAN[Math.random()*BAHAN.length|0];
   orders.push({b,pat:600+Math.random()*300});
 }
 function act(n){
   if(state!=="play")return;
   if(n===1){ // terima pesanan (bantu pelanggan baru datang cepat)
     if(orders.length<4){newOrder();S.beep(600,.05)}
   }
   else if(n===2){ // ambil nasi
     if(!holding){holding="nasi";S.beep(500,.05)}
   }
   else if(n===3){ // masak di wok
     if(holding==="nasi"&&!wok){wok={bahan:null,cook:0,burnt:false};holding=null;S.beep(400,.08)}
     else if(holding&&holding!=="nasi"&&wok&&!wok.bahan){wok.bahan=holding;holding=null;S.beep(550,.06)}
   }
   else if(n===4){ // saji
     if(wok&&wok.bahan&&!wok.burnt){
       const m=orders.find(o=>o.b===wok.bahan);
       if(m){
         orders.splice(orders.indexOf(m),1);
         money+=50;S.beep(880,.1);S.beep(1100,.12,null,0.05);
         flash=Math.min(30,flash+15);
       }else{ // salah pesanan → pelanggan marah
         lives--;S.beep(150,.2,"sawtooth");
       }
       wok=null;
     }
   }
   else if(n===5){ // buang
     if(wok){wok=null;S.beep(220,.06)}
     else if(holding){holding=null;S.beep(220,.06)}
   }
   document.getElementById("sc").textContent="Rp "+money;
 }
 S.onKey("1",()=>act(1));S.onKey("2",()=>act(2));S.onKey("3",()=>act(3));
 S.onKey("4",()=>act(4));S.onKey("5",()=>act(5));
 // click zones on canvas
 const zones=[
  {id:"b1",x:0,y:0,w:160,h:70},{id:"b2",x:160,y:0,w:160,h:70},
  {id:"b3",x:0,y:70,w:160,h:70},{id:"b4",x:160,y:70,w:160,h:70},
  {id:"b5",x:0,y:140,w:320,h:50},
 ];
 S.cv.addEventListener("pointerdown",e=>{
   const r=S.cv.getBoundingClientRect();
   const cx=(e.clientX-r.left)*(S.W/r.width),cy=(e.clientY-r.top)*(S.H/r.height);
   zones.forEach((z,i)=>{if(cx>=z.x&&cx<z.x+z.w&&cy>=z.y&&cy<z.y+z.h)act(i+1)});
 });
 ["b1","b2","b3","b4","b5"].forEach((id,i)=>{
   document.getElementById(id).addEventListener("pointerdown",e=>{e.preventDefault();act(i+1)});
 });

 function lose(){state="over";S.saveHi(money);S.over("DAPUR TUTUP!","Pelanggan kabur atau nasi gosong...","Pendapatan: Rp "+money)}

 const update=(dt)=>{
  t+=dt;
  if(state!=="play")return;
  time+=dt;
  if(flash>0)flash--;
  spawnT-=dt;
  if(spawnT<=0){if(orders.length<4)newOrder();spawnT=Math.max(90,220-time/60)}
  // patience
  for(let i=orders.length;i--;){
    orders[i].pat-=dt;
    if(orders[i].pat<=0){orders.splice(i,1);lives--;S.beep(180,.2,"sawtooth");
      if(lives<=0){lose();return}}
  }
  // cooking
  if(wok&&wok.bahan){
    wok.cook+=dt;
    if(wok.cook>300)wok.burnt=true;
    if(wok.burnt&&wok.cook>360){ // hangus total → pelanggan protes
      if(Math.random()<0.02){wok=null;lives--;S.beep(150,.25,"sawtooth");
        if(lives<=0){lose();return}}
    }
  }
  document.getElementById("tm").textContent="⏱ "+Math.floor(time/60);
 };
 const draw=(x)=>{
  // dapur wall
  x.fillStyle="#3a2a1a";x.fillRect(0,0,W,H);
  x.fillStyle="#4a3626";for(let i=0;i<8;i++)x.fillRect(0,i*60,W,3);
  // meja
  x.fillStyle="#6a4a2a";x.fillRect(0,200,W,80);
  x.fillStyle="#8a6a3a";x.fillRect(0,200,W,8);
  // pintu pelanggan (kiri atas)
  x.fillStyle="#2a1a10";x.fillRect(10,20,70,60);
  x.strokeStyle="#8a6a3a";x.strokeRect(10,20,70,60);
  // pelanggan antre
  orders.forEach((o,i)=>{
    const cx=45,cy=45+i*0; // satu slot gambar, antre via patience
    const px=45+ (i%2)*10, py=45;
    // gambar pelanggan sederhana
    x.fillStyle=["#e8a0a0","#a0c8e8","#c8e8a0","#e8d0a0"][i%4];
    x.fillRect(px-8,py-8,16,16);
    x.fillStyle="#1a1a1a";x.fillRect(px-4,py-2,3,3);x.fillRect(px+2,py-2,3,3);
    // balloon pesanan
    const bx=px+14,by=py-10;
    x.fillStyle="#fff";x.fillRect(bx,by,34,16);
    x.fillStyle="#1a1a1a";x.font="8px monospace";x.textAlign="left";
    x.fillText(o.b.toUpperCase(),bx+3,by+11);
    // patience bar
    x.fillStyle=o.pat<200?"#e5383b":"#7dc95e";
    x.fillRect(bx,by+17,34*Math.max(0,o.pat)/900,3);
  });
  // kompor/wok (tengah)
  x.fillStyle="#2a2a2a";x.fillRect(90,220,140,50);
  x.fillStyle="#444";x.fillRect(95,225,130,40);
  // wok
  if(wok){
    x.fillStyle=wok.burnt?"#1a1a1a":"#c8a030";
    x.beginPath();x.arc(160,260,30,0,Math.PI);x.fill();
    // nasi
    if(wok.cook>0){
      x.fillStyle=wok.burnt?"#333":(wok.cook>200?"#d8a858":"#f8f0d8");
      for(let i=0;i<8;i++)x.fillRect(140+i*6,248+((i%2)*6),4,3);
    }
    if(wok.bahan){
      x.fillStyle="#e5383b";x.fillRect(150,250,6,4);x.fillRect(162,254,6,4);
    }
    // progress
    if(wok.bahan){
      x.fillStyle="#000";x.fillRect(120,275,80,6);
      x.fillStyle=wok.cook>300?"#e5383b":(wok.cook>180?"#ffd429":"#7dc95e");
      x.fillRect(120,275,Math.min(80,wok.cook/360*80),6);
    }
  }else{
    x.fillStyle="#555";x.beginPath();x.arc(160,262,26,0,Math.PI);x.fill();
    x.fillStyle="#333";x.font="9px monospace";x.textAlign="center";x.fillText("WOK KOSONG",160,240);
  }
  // nasi station (kiri)
  x.fillStyle="#5a4a3a";x.fillRect(10,210,60,60);
  x.fillStyle="#f8f0d8";x.beginPath();x.arc(40,230,14,0,7);x.fill();
  x.fillStyle="#8a6a3a";x.font="8px monospace";x.textAlign="center";x.fillText("NASI",40,258);
  // holding indicator
  if(holding){
    x.fillStyle="#ffd429";x.font="bold 11px monospace";x.textAlign="center";
    x.fillText("MEMEGANG: "+holding.toUpperCase(),160,320);
  }
  // money & lives
  x.fillStyle="#7dc95e";x.font="bold 12px monospace";x.textAlign="left";
  x.fillText("❤ "+lives,10,150);
  x.fillStyle="#ffd429";x.font="bold 12px monospace";x.textAlign="right";
  x.fillText("Rp "+money,W-10,150);
  if(flash>0){x.fillStyle="rgba(125,201,94,"+(flash/60)+")";x.fillRect(0,0,W,H)}
 };
return {update, draw};
}
</script>
</body>
</html>
